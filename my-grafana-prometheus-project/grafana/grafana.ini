; filepath: c:\DeveloperApps\git\podman-compose\my-grafana-prometheus-project\grafana\grafana.ini
[log]
level = debug

[paths]
provisioning = /etc/grafana/provisioning
plugins = /var/lib/grafana/plugins

[unified_alerting]
# Ensure Unified Alerting uses our Prometheus datasource by UID
default_data_source_uid = prom

[plugins]
# Allow these unsigned core-ish plugins to load without failing startup
allow_loading_unsigned_plugins = grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app
# To disable default preinstalls entirely, set the following (left commented for now):
# preinstall_disabled = true
# Preinstall behavior notes:
# - preinstall: async/background install on startup (does not block Grafana start)
# - preinstall_sync: synchronous install before Grafana starts (blocks until done)

[feature_toggles]
# Disable loading core plugins as external
externalCorePlugins = false
# Disable automatic updates for pre-installed plugins
preinstallAutoUpdate = false
# Avoid using Loki /detected_labels API not present in Loki 2.9.x
lokiLabelNamesQueryApi = false
